name: Publier

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: publier
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests gdown
      - name: Publier les vidéos à l'heure
        env:
          META_COMPTES: ${{ secrets.META_COMPTES }}
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
          DRIVE_FOLDER_URL: ${{ secrets.DRIVE_FOLDER_URL }}
        run: python publish.py
      - name: Sauver l'état
        if: always()
        run: |
          git config user.name "pastrypower-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "état des publications" && git push)
